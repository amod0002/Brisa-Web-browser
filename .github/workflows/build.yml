name: Build APK
on: { push: { branches: [main, dev], tags: ['v*'] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: current }
      - name: Firma desde secreto (si existe)
        if: env.KS != ''
        env: { KS: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: echo "$KS" | base64 -d > debug.keystore
      - name: Compilar
        run: |
          set -o pipefail
          gradle :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --stacktrace 2>&1 | tee build.log || {
            # GitHub solo muestra 10 avisos por paso: el motivo va en uno solo, con saltos de línea codificados
            { grep -E "^e: " build.log | head -15; sed -n '/What went wrong/,/\* Try/p' build.log | head -40; } \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > err.txt
            echo "::error::$(cat err.txt)"
            exit 1; }
      - run: cp app/build/outputs/apk/release/app-release.apk brisa-${GITHUB_REF_NAME//\//-}.apk
      - uses: actions/upload-artifact@v6
        with: { name: brisa, path: 'brisa-*.apk' }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'brisa-*.apk' }
