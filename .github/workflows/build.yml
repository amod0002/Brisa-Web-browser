name: Build APK
on: { push: { branches: [main], tags: ['v*'] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Firma desde secreto (si existe)
        if: env.KS != ''
        env: { KS: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: echo "$KS" | base64 -d > debug.keystore
      - run: gradle :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk brisa-${GITHUB_REF_NAME//\//-}.apk
      - uses: actions/upload-artifact@v4
        with: { name: brisa, path: 'brisa-*.apk' }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'brisa-*.apk' }
