name: Build APK
on: { push: { branches: [main, dev], tags: ['v*'] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "9.8.2" }
      - name: Clave de firma (secretos del repositorio)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::warning::Faltan los secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD: se compila y se prueba, pero no habrá APK."
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/brisa-release.jks"
          echo "BRISA_KEYSTORE=$RUNNER_TEMP/brisa-release.jks" >> "$GITHUB_ENV"
          echo "BRISA_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "::add-mask::$PW"
      - name: Compilar
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace 2>&1 | tee build.log || {
            set +e   # el diagnóstico no debe cortarse si un grep no encuentra nada
            grep -E "^e: " build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            # Registro completo en la rama ci-log (se sobrescribe en cada fallo)
            mkdir -p /tmp/log && tail -c 400000 build.log > /tmp/log/build.log && cd /tmp/log && git init -q -b ci-log \
              && git -c user.name=ci -c user.email=ci@localhost add build.log \
              && git -c user.name=ci -c user.email=ci@localhost commit -qm "Registro de ${GITHUB_SHA::7}" \
              && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log || true
            exit 1; }
      - name: Comprobar firma
        run: |
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::APK sin firmar: añade los secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - run: cp app/build/outputs/apk/release/app-release.apk brisa-${GITHUB_REF_NAME//\//-}.apk
      - uses: actions/upload-artifact@v6
        with: { name: brisa, path: 'brisa-*.apk' }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'brisa-*.apk' }
